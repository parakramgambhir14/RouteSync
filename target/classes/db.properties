# ---------------------------------------------------------
# This app points at a plain SQLite file — the whole database
# is data/routesync.db, sitting right in this project folder.
# No server to install, no username/password required.
#
# It currently has ZERO tables in it. Build your schema onto
# it however you like: run CREATE TABLE statements yourself
# through DatabaseConnection.getConnection(), or open the file
# directly in a tool like "DB Browser for SQLite"
# (https://sqlitebrowser.org) and design it visually.
# ---------------------------------------------------------

db.driver=org.sqlite.JDBC

# Path is relative to wherever the app is run from (the project root
# if you're using mvn compile exec:java). Change it if you move the file.
db.url=jdbc:sqlite:data/routesync.db

# SQLite doesn't use accounts — these are unused but kept for consistency
# with DatabaseConnection.java (and in case you switch drivers later).
db.user=
db.password=
